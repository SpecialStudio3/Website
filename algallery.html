<script>

const canvas = document.getElementById("snakeGame");
const ctx = canvas.getContext("2d");

const grid = 10;
let count = 0;

let snake = {
  x: 100,
  y: 100,
  dx: grid,
  dy: 0,
  cells: [],
  maxCells: 4
};

let apple = {
  x: 160,
  y: 160
};

function getRandomInt(min,max){
  return Math.floor(Math.random()*(max-min))+min;
}

function gameLoop(){
  requestAnimationFrame(gameLoop);

  if(++count < 6){
    return;
  }

  count = 0;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  snake.x += snake.dx;
  snake.y += snake.dy;

  if(snake.x < 0) snake.x = canvas.width-grid;
  else if(snake.x >= canvas.width) snake.x = 0;

  if(snake.y < 0) snake.y = canvas.height-grid;
  else if(snake.y >= canvas.height) snake.y = 0;

  snake.cells.unshift({x:snake.x,y:snake.y});

  if(snake.cells.length > snake.maxCells){
    snake.cells.pop();
  }

  ctx.fillStyle = "red";
  ctx.fillRect(apple.x,apple.y,grid-1,grid-1);

  ctx.fillStyle = "lime";

  snake.cells.forEach(function(cell,index){

    ctx.fillRect(cell.x,cell.y,grid-1,grid-1);

    if(cell.x === apple.x && cell.y === apple.y){
      snake.maxCells++;
      apple.x = getRandomInt(0,20)*grid;
      apple.y = getRandomInt(0,20)*grid;
    }

    for(let i=index+1;i<snake.cells.length;i++){
      if(cell.x === snake.cells[i].x && cell.y === snake.cells[i].y){
        snake.x = 100;
        snake.y = 100;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;

        apple.x = getRandomInt(0,20)*grid;
        apple.y = getRandomInt(0,20)*grid;
      }
    }

  });
}

document.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft" && snake.dx === 0){
    snake.dx = -grid;
    snake.dy = 0;
  }

  else if(e.key === "ArrowUp" && snake.dy === 0){
    snake.dy = -grid;
    snake.dx = 0;
  }

  else if(e.key === "ArrowRight" && snake.dx === 0){
    snake.dx = grid;
    snake.dy = 0;
  }

  else if(e.key === "ArrowDown" && snake.dy === 0){
    snake.dy = grid;
    snake.dx = 0;
  }

});

requestAnimationFrame(gameLoop);

</script>

<script>
function playPause(id){
  let a = document.getElementById(id);
  if(a.paused){ a.play(); } else { a.pause(); }
}

function setVolume(id, v){
  document.getElementById(id).volume = v;
}

// Seek sliders
const seekSliders = [
  {audio:'song1', slider:'seek1'},
  {audio:'song2', slider:'seek2'},
  {audio:'song3', slider:'seek3'}
];

seekSliders.forEach(obj => {
  let audio = document.getElementById(obj.audio);
  let slider = document.getElementById(obj.slider);

  // Update slider as song plays
  audio.addEventListener('timeupdate', function(){
    if(audio.duration) slider.value = (audio.currentTime / audio.duration) * 100;
  });

  // Jump to position when slider is dragged
  slider.addEventListener('input', function(){
    if(audio.duration) audio.currentTime = (slider.value / 100) * audio.duration;
  });
});
</script>
